<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen One-Shot</title>
<style>
:root{--ink:#15202b;--muted:#687582;--line:#dce3e8;--soft:#f5f7f8;--accent:#e36e32;--dark:#101820}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}a{color:inherit}.shell{max-width:1500px;margin:auto;padding:28px clamp(18px,4vw,64px) 56px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em;margin:0 0 6px}.lede{color:var(--muted);margin:0;max-width:700px}.button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:22px}.toolbar label{font-size:12px;text-transform:uppercase;font-weight:750;letter-spacing:.08em;color:var(--muted)}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.pill.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.model-tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.model-tab{min-width:180px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer}.model-tab.active{border-color:var(--accent);box-shadow:0 0 0 2px #f6d6c5}.model-tab strong{display:block}.model-tab small{color:var(--muted)}
.count{color:var(--muted);margin-left:auto;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.thumb{display:block;aspect-ratio:16/9;background:#e8edf0;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:13px}.card-body{padding:15px}.eyebrow{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.09em}.card h2{font-size:18px;margin:4px 0 10px}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.card-actions{display:flex;gap:8px;margin-top:14px}.card-actions .button{padding:8px 10px;font-size:13px}
.presentation{min-height:100vh;background:var(--dark);color:#fff}.presentation .shell{max-width:none;padding:18px 24px 22px}.presentation header{justify-content:center;text-align:center;margin-bottom:13px}.presentation header .lede,.presentation header .button{display:none}.presentation h1{font-size:24px;margin:0}.presentation .toolbar{background:transparent;border:0;padding:0;justify-content:center;margin:0 0 13px}.presentation .toolbar label,.presentation .toolbar .track-filter,.presentation .toolbar .task-filter,.presentation .toolbar .count{display:none}.presentation .model-tabs{justify-content:center;margin-bottom:14px}.presentation .model-tab{min-width:150px;background:#1d2a34;color:#fff;border-color:#344550;text-align:center;padding:9px 12px}.presentation .model-tab.active{border-color:#f29a68;background:#293a46;box-shadow:none}.presentation .model-tab small{color:#b8c4cb}.present-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;min-height:calc(100vh - 118px)}.present-sidebar{background:#17232c;border:1px solid #30414d;border-radius:13px;padding:13px;overflow:auto}.present-sidebar h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#aebdc6;margin:2px 4px 11px}.present-sidebar button{display:block;width:100%;text-align:left;background:transparent;color:#d8e1e6;border:0;border-radius:8px;padding:9px 8px;cursor:pointer}.present-sidebar button.active{background:#30414d;color:#fff}.present-main{min-width:0;display:flex;flex-direction:column}.present-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 9px}.present-heading h2{font-size:20px;margin:0}.present-heading span{color:#aebdc6;font-size:13px}.frame-wrap{flex:1;min-height:500px;border-radius:13px;overflow:hidden;background:#fff;border:1px solid #30414d}.frame-wrap iframe{width:100%;height:100%;min-height:500px;border:0;background:#fff}
@media(max-width:720px){.shell{padding:20px 14px 40px}header{display:block}.toolbar{margin-top:18px}.count{width:100%;margin-left:0}.present-layout{grid-template-columns:1fr;min-height:0}.present-sidebar{max-height:150px}.frame-wrap,.frame-wrap iframe{min-height:70vh}.presentation .shell{padding:12px}.presentation .model-tab{min-width:0}.presentation .model-tab small{display:none}}
/* homepage refresh */
body{background:radial-gradient(circle at 88% 0,#183d45 0,transparent 34rem),radial-gradient(circle at 0 22%,#20293a 0,transparent 30rem),#0b151b;color:#eaf0f2}
.shell{max-width:1440px;padding:24px clamp(18px,5vw,78px) 70px}.home-top{display:flex;align-items:center;justify-content:space-between;padding:3px 0 34px}.home-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750}.home-mark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#f08a50,#d95887);color:#101920}.home-nav{display:flex;gap:22px;align-items:center;color:#9baab2;font-size:13px}.home-nav a{text-decoration:none}.home-nav a:hover{color:#fff}.home-nav .button{color:#fff;padding:8px 13px;border-radius:999px;background:#15262f}
.home-hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(330px,.88fr);gap:clamp(30px,7vw,100px);align-items:center;padding:46px 0 62px}.home-kicker{display:flex;align-items:center;gap:9px;color:#69d6d0;font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:750}.home-kicker i{display:block;width:24px;height:1px;background:#69d6d0}.home-hero h1{font-size:clamp(46px,7.5vw,105px);line-height:.93;letter-spacing:-.075em;margin:21px 0 25px}.home-hero h1 em{font-style:normal;color:#f08a50}.home-copy{max-width:570px;color:#9baab2;font-size:18px;line-height:1.6;margin:0}.home-actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}.home-actions .button{border-radius:999px;padding:11px 18px;font-weight:650;background:#edf5f4;color:#0d1a20;border-color:#edf5f4}.home-actions .button.primary{background:#15262f;color:#eaf0f2;border-color:#38505b}.home-actions .button:hover{border-color:#69d6d0}.home-hero-card{position:relative;min-height:290px;border:1px solid #39515c;border-radius:22px;background:linear-gradient(145deg,#1b313b,#101d25);padding:25px;overflow:hidden;box-shadow:0 24px 80px #00000047}.home-hero-card:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-45px;top:-80px;background:radial-gradient(circle,#65ddd0aa 0,transparent 65%)}.home-hero-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-85px;bottom:-110px;background:#ec805533}.home-hero-card>*{position:relative;z-index:1}.home-hero-card .eyebrow{color:#9baab2}.home-hero-card h2{font-size:27px;letter-spacing:-.04em;margin:52px 0 4px}.home-hero-card p{color:#b7c6cc;margin:0}.home-hero-card a{display:inline-block;margin-top:21px;color:#69d6d0;text-decoration:none;font-size:13px}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #2a3a44;padding:20px 0;margin-bottom:65px}.home-stat{padding:0 22px;border-left:1px solid #2a3a44}.home-stat:first-child{border-left:0;padding-left:0}.home-stat strong{display:block;font-size:27px;letter-spacing:-.04em}.home-stat span{display:block;color:#9baab2;font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.home-section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:19px}.home-section-head h2{font-size:28px;letter-spacing:-.05em;margin:0}.home-section-head p{color:#9baab2;margin:4px 0 0}.home-section-head .count{color:#9baab2;font-size:13px}
@media(max-width:820px){.home-nav{display:none}.home-hero{grid-template-columns:1fr;padding-top:25px}.home-hero-card{min-height:225px}.home-hero-card h2{margin-top:32px}}@media(max-width:620px){.home-top{padding-bottom:22px}.home-hero h1{font-size:55px}.home-copy{font-size:16px}.home-stats{grid-template-columns:1fr;gap:15px}.home-stat{padding:0;border-left:0}.home-stat strong{font-size:23px}.home-section-head{display:block}.home-section-head .count{display:block;margin-top:8px}}
/* contrast fixes for the dark showcase theme */
.model-tab{background:#14232c;color:#eaf0f2;border-color:#2a3a44}.model-tab small{color:#9baab2}.model-tab.active{background:#20313a;border-color:#f08a50}.toolbar{background:#14232c;border-color:#2a3a44}.toolbar label{color:#9baab2}.pill{background:#172a33;color:#c7d2d7;border-color:#38505b}.pill.active{background:#edf5f4;color:#0d1a20;border-color:#edf5f4}.card{background:#14232c;border-color:#2a3a44}.card-body{background:#14232c;color:#eaf0f2}.card h2,.card h3{color:#eaf0f2}.card .meta{color:#9baab2}.card-actions .button{background:#172a33;color:#eaf0f2;border-color:#38505b}.card-actions .button.primary{background:#f08a50;color:#101820;border-color:#f08a50}.card-actions .button:hover{border-color:#69d6d0}.section-head h2,.home-section-head h2{color:#eaf0f2}/* creator profile card */
.home-hero-side{display:grid;gap:13px}.x-card{display:flex;align-items:center;gap:13px;text-decoration:none;border:1px solid #2a3a44;border-radius:15px;padding:13px 16px;background:#12232c;color:#eaf0f2;transition:border-color .18s,transform .18s,background .18s}.x-card:hover{border-color:#69d6d0;background:#172d36;transform:translateY(-2px)}.x-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#eaf0f2;color:#101820;font-weight:800;font-size:17px}.x-copy{display:grid;gap:1px;flex:1}.x-copy small{color:#9baab2;font-size:11px;text-transform:uppercase;letter-spacing:.11em}.x-copy strong{font-size:14px}.x-arrow{color:#69d6d0;font-size:18px}</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var app=document.getElementById("app"), data=null;
  var params=new URLSearchParams(location.search), presentation=params.get("present")==="1";
  var state={model:params.get("model")||"",track:params.get("track")||"all",task:params.get("task")||""};
  function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",[String.fromCharCode(34)]:"&quot;","'":"&#39;"}[c]})}
  function models(){return data.models||[]}
  function selectedModel(){return models().find(function(m){return m.id===state.model})||models()[0]}
  function tracks(model){var out=[];["web"].forEach(function(t){(model.tracks[t]||[]).forEach(function(x){out.push(x)})});return out}
  function visibleItems(model){var all=tracks(model);if(state.track!=="all")all=all.filter(function(x){return x.track===state.track});return all}
  function selectedItem(model){var list=visibleItems(model);return list.find(function(x){return x.id===state.task})||list[0]}
  function updateUrl(extra){Object.keys(extra||{}).forEach(function(k){state[k]=extra[k]});var q=new URLSearchParams({present:presentation?"1":"0",model:state.model,track:state.track,task:state.task});history.replaceState(null,"","?"+q.toString());render()}
  function modelTabs(){return models().map(function(m){return '<button class="model-tab '+(m.id===selectedModel().id?"active":"")+'" data-model="'+esc(m.id)+'"><strong>'+esc(m.label)+'</strong><small>'+esc(m.name)+' · '+esc(m.quant)+'</small></button>'}).join("")}
  function presentPage(){
    var model=selectedModel(), item=selectedItem(model), list=visibleItems(model);
    if(!item)return '<main class="shell"><p>No curated demos in this selection.</p></main>';
    return '<main class="shell"><header><div><h1>'+esc(data.title||"Qwen One-Shot")+'</h1><p class="lede">'+esc(data.description||"")+'</p></div></header><nav class="model-tabs">'+modelTabs()+'</nav><section class="present-layout"><aside class="present-sidebar"><h2>'+esc(model.label)+'</h2>'+list.map(function(x){return '<button class="'+(x.id===item.id?"active":"")+'" data-task="'+esc(x.id)+'">'+esc(x.title)+'</button>'}).join("")+'</aside><section class="present-main"><div class="present-heading"><h2>'+esc(item.title)+'</h2><span>'+esc(model.label)+' · '+esc(item.track.toUpperCase())+' · '+""+'</span></div><div class="frame-wrap"><iframe title="'+esc(item.title)+'" src="'+esc(item.url)+'"></iframe></div></section></section></main>';
  }
  function galleryPage(){var model=selectedModel(),items=visibleItems(model),all=tracks(model),web=all.length;return '<main class="shell"><div class="home-top"><a class="home-brand" href="./"><span class="home-mark">Q</span><span>Qwen One-Shot</span></a><nav class="home-nav"><a href="#collection">Collection</a><a href="#models">Models</a><a href="#about">About</a><a class="button" href="?present=1&model='+encodeURIComponent(model.id)+'">Presentation mode ↗</a></nav></div><section class="home-hero"><div><div class="home-kicker"><i></i> One prompt · one sample · one 3090</div><h1>One shot.<br><em>Fifty sites.</em></h1><p class="home-copy">Each website is a single generation from Qwen 3.8 27B — no multi-pass design, no hand-built layout. One RTX 3090. Open any page and see what one sample looks like when the prompt becomes a site.</p><div class="home-actions"><a class="button primary" href="#collection">Explore the collection ↓</a><a class="button" href="?present=1&model='+encodeURIComponent(model.id)+'">Open presentation ↗</a></div></div><div class="home-hero-side"><aside class="home-hero-card"><div class="eyebrow">One-shot · Q4_K_M</div><h2>'+esc(model.label)+'</h2><p>'+esc(model.notes||"Selected Qwen model output")+'</p><a href="#models">Browse this model →</a></aside><a class="x-card" href="https://x.com/ItsmeAjayKV" target="_blank" rel="noopener noreferrer"><span class="x-mark">𝕏</span><span class="x-copy"><small>Follow the build</small><strong>@ItsmeAjayKV</strong></span><span class="x-arrow">↗</span></a></div></section><section class="home-stats" id="about"><div class="home-stat"><strong>1-shot</strong><span>one sample per site</span></div><div class="home-stat"><strong>'+data.models.reduce(function(n,m){return n+tracks(m).length},0)+'</strong><span>complete websites</span></div><div class="home-stat"><strong>3090</strong><span>single GPU, local</span></div></section><section id="models"><div class="home-section-head"><div><h2>Choose a model</h2><p>Switch the lens, then explore its selected set.</p></div></div><div class="model-tabs">'+modelTabs()+'</div></section><section id="collection"><div class="home-section-head"><div><h2>Selected work</h2><p>Self-contained pages, ready to open or present.</p></div><span class="count">'+items.length+' in this view</span></div><section class="grid">'+items.map(function(x){var shot=(x.screenshots||[]).find(function(y){return y.kind==="desktop"})||(x.screenshots||[])[0];return '<article class="card">'+(shot?'<a class="thumb" href="'+esc(x.url)+'"><img loading="lazy" src="'+esc(shot.url)+'" alt=""></a>':'<a class="thumb empty" href="'+esc(x.url)+'">Open demo</a>')+'<div class="card-body"><div class="eyebrow">Website</div><h2>'+esc(x.title)+'</h2><div class="meta">'+""+'</div><div class="card-actions"><a class="button primary" href="'+esc(x.url)+'">Open page</a><a class="button" href="?present=1&model='+encodeURIComponent(model.id)+'&track='+encodeURIComponent(x.track)+'&task='+encodeURIComponent(x.id)+'">Present</a></div></div></article>'}).join("")+'</section></section><footer class="footer"><span>Qwen One-Shot</span><a href="#about">One sample per site · generated locally on one RTX 3090</a></footer></main>'}
  function render(){if(!data)return;document.body.className=presentation?"presentation":"";app.innerHTML=presentation?presentPage():galleryPage();app.querySelectorAll("[data-model]").forEach(function(b){b.onclick=function(){updateUrl({model:b.dataset.model,task:""})}});app.querySelectorAll("[data-track]").forEach(function(b){b.onclick=function(){updateUrl({track:b.dataset.track,task:""})}});app.querySelectorAll("[data-task]").forEach(function(b){b.onclick=function(){updateUrl({task:b.dataset.task})}})}
  fetch("catalog.json").then(function(r){if(!r.ok)throw Error("catalog unavailable");return r.json()}).then(function(x){data=x;state.model=selectedModel().id;render()}).catch(function(e){app.innerHTML='<main class="shell"><h1>Showcase unavailable</h1><p>'+esc(e.message)+'</p></main>'});
})();
</script>
</body>
</html>
